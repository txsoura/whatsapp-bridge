services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: always
    # Bound to localhost only — Caddy reverse-proxies 443 to this port.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - bridge_net

  # Provisioning gatekeeper (Option B): the only service holding the Evolution API global
  # key. Consuming projects get their own scoped key instead — see proxy/src/add-project.ts.
  gatekeeper:
    build: ./proxy
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    # Same shared .env as evolution-api — one secrets source (works cleanly with Doppler).
    env_file:
      - .env
    volumes:
      - ./proxy/data:/app/data
    networks:
      - bridge_net
    depends_on:
      - evolution-api

networks:
  bridge_net:

volumes:
  evolution_instances:
